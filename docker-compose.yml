services:

  db:
    image: postgres:15-alpine
    container_name: messenger-db
    environment:
      POSTGRES_DB: messenger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d messenger"]
      interval: 10s
      timeout: 5s
      retries: 5
    restatr: unless-stoped

  app:
    build: .
    container_name: messenger-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/messenger
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - define it in .env}
      ADMIN_LOGIN: ${ADMIN_LOGIN:?ADMIN_LOGIN is required - define it in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required - define it in .env}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Administrator}
      # R9: путь ВНУТРИ контейнера — не секрет сам по себе, секрет это файл,
      # который монтируется ниже из secrets/ (в .gitignore). Пусто/файла нет →
      # FirebaseConfig тихо отключает push (см. его комментарий).
      FIREBASE_CREDENTIALS_PATH: /app/secrets/firebase-service-account.json
      # Не секрет (публичный адрес сервера) — нужен, чтобы вложить абсолютный
      # URL аватара в push-уведомление (см. MessageService.resolveAvatarUrl).
      MESSENGER_PUBLIC_URL: https://45.143.203.241
    volumes:
      - app_storage:/app/storage
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stoped

  nginx:
    image: nginx:alpine
    container_name: messenger-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stoped

volumes:
  postgres_data:
  app_storage:
