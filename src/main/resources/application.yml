spring:
  application:
    name: messenger
  servlet:
    multipart:
      max-file-size: 5GB
      max-request-size: 5GB
      # Входящий файл пишется на диск в тот же том, что storage/files
      # (атомарный rename при сохранении). file-size-threshold: 0 —
      # никогда не буферизовать в память (иначе 5 ГБ убьют heap).
      location: storage/tmp
      file-size-threshold: 0B

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/messenger}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

messenger:
  admin:
    bootstrap-login: ${ADMIN_LOGIN:}
    bootstrap-password: ${ADMIN_PASSWORD:}
    bootstrap-display-name: ${ADMIN_DISPLAY_NAME:Administrator}
  storage:
    base-dir: storage
    # Резерв диска: ниже этого порога загрузки отклоняются (507),
    # чтобы переполнение не уронило Postgres.
    min-free-space: 10GB

logging:
  level:
    org.springframework: INFO
    com.geckofly.messenger: INFO

server:
  port: 8080
  forward-headers-strategy: framework
