spring:
  application:
    name: messenger
  # multipart настраивается в config/MultipartConfig (нужен абсолютный путь location),
  # а не здесь — см. комментарий в том классе.

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/messenger}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

messenger:
  admin:
    bootstrap-login: ${ADMIN_LOGIN:}
    bootstrap-password: ${ADMIN_PASSWORD:}
    bootstrap-display-name: ${ADMIN_DISPLAY_NAME:Administrator}
  storage:
    base-dir: storage
    # Резерв диска: если ПОСЛЕ файла свободного места станет меньше — 507.
    # 1 ГБ, т.к. диск VPS всего 15 ГБ.
    min-free-space: 1GB
    max-file-size: 5GB

logging:
  level:
    org.springframework: INFO
    com.geckofly.messenger: INFO

server:
  port: 8080
  forward-headers-strategy: framework
