spring:
  application:
    name: messenger
  # multipart настраивается в config/MultipartConfig (нужен абсолютный путь location),
  # а не здесь — см. комментарий в том классе.

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/messenger}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

messenger:
  admin:
    bootstrap-login: ${ADMIN_LOGIN:}
    bootstrap-password: ${ADMIN_PASSWORD:}
    bootstrap-display-name: ${ADMIN_DISPLAY_NAME:Administrator}
  storage:
    base-dir: storage
    # Резерв диска: если ПОСЛЕ файла свободного места станет меньше — 507.
    # 1 ГБ, т.к. диск VPS всего 15 ГБ.
    min-free-space: 512MB
    max-file-size: 5GB
    retention-days: 7
    emergency-free-space: 1GB
    # Как часто sweep-джоба чистит доставленные/просроченные файлы (ISO-8601 duration).
    sweep-interval: PT1H
  firebase:
    # Путь к service-account JSON для FCM. Пусто → push отключён (R9).
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  # Публичный адрес сервера — чтобы превратить относительный /api/uploads/avatars/...
  # в абсолютный URL для аватара в push-уведомлении (FCM image требует полный URL).
  # Пусто → push просто идёт без картинки, ничего не ломается.
  public-url: ${MESSENGER_PUBLIC_URL:}

logging:
  level:
    org.springframework: INFO
    com.geckofly.messenger: INFO

server:
  port: 8080
  forward-headers-strategy: framework
