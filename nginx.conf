events {}

http {
    # Лимит тела запроса под файлы до 5 ГБ (R3).
    client_max_body_size 5g;

    server {
        listen 80;
        server_name localhost;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location /api/ {
            proxy_pass http://app:8080;

            # Не буферизовать тело на диск nginx — стримить прямо в приложение.
            # Иначе 5 ГБ сначала лягут во временную папку nginx, потом ещё раз в storage.
            proxy_request_buffering off;
            # Большой файл по мобильной сети грузится долго — час на приём/ответ.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws-native {
            proxy_pass http://app:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;
        }
    }
}
